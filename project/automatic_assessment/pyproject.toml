[project]
name = "automatic-assessment"
version = "0.1.0"
description = ""
authors = [{ name = "AndreasZachariae", email = "Andreas.Zachariae@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
# NOTE: `torch` is intentionally NOT listed here. It is installed manually
# in the Dockerfile (CUDA-matched build) BEFORE the poetry install, and the
# framework imports it everywhere. Installing this package outside that
# Docker image requires installing torch first (see optional extra below).
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-optimize (>=0.10.2,<0.11.0)",
    "optuna (>=4.6.0,<5.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "antropy (>=0.1.9,<0.2.0)",
    "xgboost (>=3.1.2,<4.0.0)",
    "torchinfo (>=1.8.0,<2.0.0)",
    "tqdm (>=4.66.0,<5.0.0)",
    "scipy (>=1.11.0,<2.0.0)",
    "pyyaml (>=6.0,<7.0)",
]

[project.optional-dependencies]
# For environments WITHOUT the Docker-provided torch build:
#   pip install .[torch]
torch = ["torch (>=2.1.0)"]

[tool.poetry]
packages = [{ include = "automatic_assessment", from = "src" }]

[tool.poetry.scripts]
# Syntax: script-name = "package.module:function"
main = "automatic_assessment.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
